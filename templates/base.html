<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Hiring Pipeline</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-premium fixed-top shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="{{ url_for('candidates.dashboard') }}">
                <i class="bi bi-layers-half me-2 fs-4 text-primary"></i>
                Hiring <span class="fw-light ms-1 opacity-75">Pipeline</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <!-- Smart Search Form -->
                <form class="d-flex mx-auto search-form" action="{{ url_for('search.search_page') }}" method="GET" style="width: 50%;">
                    <div class="input-group search-glass">
                        <span class="input-group-text bg-transparent border-0 text-white">
                            <i class="bi bi-search"></i>
                        </span>
                        <input class="form-control border-0 bg-transparent text-white placeholder-light" 
                               type="search" name="q" placeholder="Search (e.g. 'Interview candidates since Monday' or 'sharam')" 
                               aria-label="Search" value="{{ query if query else '' }}" required>
                    </div>
                </form>
                
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                        <button class="btn btn-primary d-flex align-items-center rounded-pill px-4 shadow-sm fw-medium" 
                                data-bs-toggle="modal" data-bs-target="#addCandidateModal">
                            <i class="bi bi-plus-lg me-2"></i> Add Candidate
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Envelope -->
    <main class="container-fluid px-4 pt-5 mt-5">
        
        <!-- Flash Messages -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="toast align-items-center text-white bg-{{ 'success' if category == 'success' else 'danger' }} border-0 show" role="alert">
                            <div class="d-flex">
                                <div class="toast-body fw-medium">
                                    <i class="bi bi-{{ 'check-circle' if category == 'success' else 'exclamation-circle' }} me-2"></i>
                                    {{ message }}
                                </div>
                                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                            </div>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        {% block content %}{% endblock %}
    </main>

    <!-- Add Candidate Modal -->
    <div class="modal fade" id="addCandidateModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered border-0">
            <div class="modal-content rounded-4 shadow border-0">
                <div class="modal-header border-bottom-0 pt-4 pb-0 px-4">
                    <h5 class="modal-title fw-bold fs-4">New Candidate</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form action="{{ url_for('candidates.add_candidate') }}" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label text-muted fw-medium small">Full Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control form-control-lg bg-light border-0" placeholder="e.g. Rahul Sharma" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted fw-medium small">Email <span class="text-danger">*</span></label>
                                <input type="email" name="email" class="form-control form-control-lg bg-light border-0" placeholder="candidate@email.com" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted fw-medium small">Phone <span class="text-danger">*</span></label>
                                <input type="text" name="phone" class="form-control form-control-lg bg-light border-0" placeholder="+91 9876543210" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-medium small">Job Role <span class="text-danger">*</span></label>
                            <input type="text" name="role" class="form-control form-control-lg bg-light border-0" placeholder="e.g. Software Engineer" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-medium small">Resume PDF File <span class="text-danger">*</span></label>
                            <input type="file" name="resume" accept=".pdf" class="form-control form-control-lg bg-light border-0" required>
                            <div class="form-text text-muted small">Upload candidate resume in PDF format only.</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted fw-medium small">Notes <span class="text-danger">*</span></label>
                            <textarea name="notes" class="form-control bg-light border-0" rows="3" placeholder="Enter candidate initial notes/evaluation..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm">Add Candidate to Pipeline</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
